require:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'bin/**/*'
    - 'db/migrate/**/*'

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 15

# Event is deliberately the centre of gravity of this gem — "the event is the
# model" — so it carries the whole write path rather than spreading it thin.
Metrics/ClassLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
    - 'config/routes.rb'
