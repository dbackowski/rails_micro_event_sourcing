require:
  - rubocop-rails

# Add to RuboCop's default excludes (vendor/, tmp/, node_modules/, .git/) rather
# than replace them. Without this, CI's vendor/bundle gets scanned and a gem's
# own .rubocop.yml (mini_mime inherits rubocop-discourse) aborts the run.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'bin/**/*'
    - 'db/migrate/**/*'

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 15

# Event is deliberately the centre of gravity of this gem — "the event is the
# model" — so it carries the whole write path rather than spreading it thin.
Metrics/ClassLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
    - 'config/routes.rb'
